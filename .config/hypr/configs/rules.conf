# -----------------------------------------------------
# Window Rules Configuration
# Updated for Hyprland (RE2 Engine)
# See: https://wiki.hypr.land/Configuring/Window-Rules/
# -----------------------------------------------------

# -----------------------------------------------------
# Global Rules
# -----------------------------------------------------
# 使用 match:class .* 匹配所有窗口

windowrule = opacity 0.75, match:class .*
# 绑定快捷键：给当前窗口打上 Is_opaque 标签
bind = ALT, w, tagwindow, Is_opaque

# 针对打了 Is_opaque 标签的窗口强制不透明
windowrule = opaque on, match:tag Is_opaque
windowrule = animation popin, match:class .*
# -----------------------------------------------------
# Fixes & System
# -----------------------------------------------------
# 修复 XWayland 的幽灵窗口 (空类名且空标题)
# RE2 正则：^$ 表示精确匹配空字符串
windowrule {
  name = fix-ghost-window
  match:class = ^$
  match:xwayland = true
  match:float = true
  match:fullscreen = false
  match:pin = false
}
# windowrule = suppress_event maximize, match:class .*

# -----------------------------------------------------
# Applications
# -----------------------------------------------------

# Kitty
windowrule {
  name = kitty
  match:class = kitty
  float = on
  center = on
  opacity = 0.85
  size = 768 512
  animation = popin
}


#windowrule {
#  name = floating-panels
#  match:float = true
#  size = 512 512
#  center = on
#}



# Microsoft Edge
# 优化正则：移除多余捕获组，^msedge.*$ 匹配以 msedge 开头的所有类名
windowrule = tag Is_opaque, match:class ^microsoft-edge$
windowrule = float on, size (monitor_w*0.5) (monitor_h*0.5), match:class ^msedge.*$

windowrule {
  name = QQ/Wechat
  match:class = ^QQ|微信$
  float = on
  center = on
  size = 1024 768
  animation = popin
}

# Zotero (匹配启动时的类名和标题)
# 正则：^Zotero.+$ 匹配以 Zotero 开头且后面至少有一个字符的字符串
windowrule = float on, match:initial_class ^Zotero$, match:initial_title ^Zotero.+$

# WPS & Tools
windowrule = float on, match:class ^qt-sudo$
windowrule = float on, match:title ^wps$

# -----------------------------------------------------
# Dialogs & Popups (Refactored Regex)
# -----------------------------------------------------
# 优化逻辑：将原来的多行规则合并，并使用更干净的 RE2 正则
# 移除 (.*) 捕获组，改为 .* 通配符

# 常见文件操作窗口
windowrule = float on, center on, match:title ^打开文件.*$
windowrule = float on, center on, match:title ^选择文件.*$
windowrule = float on, center on, size (monitor_w*0.5) (monitor_h*0.5), match:title ^Choose wallpaper.*$
windowrule = float on, center on, match:title ^Open Folder.*$
windowrule = float on, center on, match:title ^Save As.*$
windowrule = float on, center on, match:title ^Library.*$
windowrule = float on, center on, match:title ^File Upload.*$

# 确认/提示对话框 (匹配结尾)
# 正则：.*wants to save$ 匹配以 wants to save 结尾的字符串
windowrule = float on, center on, match:title .*wants to save$
windowrule = float on, center on, match:title .*wants to open$

# 杂项工具
windowrule = float on, match:class ^blueberry\.py$
windowrule = float on, match:class ^guifetch$

# 音频与网络控制 (合并了 pavucontrol 的规则)
windowrule = float on, center on, size 45%, match:class ^(org\.pulseaudio\.)?pavucontrol$
windowrule = float on, center on, size 45%, match:class ^nm-connection-editor$

# KDE/Plasma 相关弹窗
windowrule = float on, match:class .*plasmawindowed.*
windowrule = float on, match:class ^kcm_.*
windowrule = float on, match:class .*bluedevilwizard$
windowrule = float on, match:title .*Welcome$
windowrule = float on, match:title .*Shell conflicts.*
windowrule = float on, size 60% 65%, match:class ^org\.freedesktop\.impl\.portal\.desktop\.kde$
windowrule = float on, match:class ^xdg-desktop.*

# 防止 KDE 切换图标时的窗口获取焦点
windowrule = float on, move 999999 999999, no_initial_focus on, match:class ^plasma-changeicons$

# Dolphin 复制进度条
windowrule = move 40 80, match:title ^Copying — Dolphin$

# Warp Terminal
windowrule = tile on, match:class ^dev\.warp\.Warp$

# -----------------------------------------------------
# Picture-in-Picture (PiP)
# -----------------------------------------------------
# 优化正则：[Pp] 匹配大小写，[-\s]? 匹配可选的分隔符
windowrule = float on, pin on, keep_aspect_ratio on, move 73% 72%, size 25%, match:title ^[Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture.*$

# -----------------------------------------------------
# Tearing & Performance
# -----------------------------------------------------
# 允许撕裂 (Tearing)
windowrule = immediate on, match:title .*\.exe$
windowrule = immediate on, match:title .*minecraft.*
windowrule = immediate on, match:class ^steam_app.*

# 修复 Jetbrains IDE 焦点问题 (排除 win+数字 的辅助窗口)
# 正则说明：^$ (空) 或 ^\s$ (仅空格) 或 ^win\d+$ (win后跟数字)
windowrule = no_initial_focus on, match:class ^jetbrains-.*$, match:float on true, match:title ^$|^\s$|^win\d+$

# 对非浮动窗口去阴影
windowrule = no_shadow on, match:float false

# -----------------------------------------------------
# Workspace Rules
# -----------------------------------------------------
workspace = special:special, gapsout:30

# -----------------------------------------------------
# Layer Rules
# -----------------------------------------------------
# 修正：Layer rules 使用 match:namespace 而不是 regex 直接匹配
layerrule = xray 1, match:namespace .*

# 禁用动画
layerrule = no_anim on, match:namespace ^(walker|selection|overview|anyrun|osk|hyprpicker)$
layerrule = no_anim on, match:namespace ^indicator.*
layerrule = no_anim on, match:namespace ^noanim$

# 模糊效果
layerrule = blur on, ignore_alpha 0, match:namespace ^gtk-layer-shell$
layerrule = blur on, ignore_alpha 0.5, match:namespace ^launcher$
layerrule = blur on, ignore_alpha 0.69, match:namespace ^notifications$
layerrule = blur on, match:namespace ^logout_dialog$

